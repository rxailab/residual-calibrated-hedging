<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Font configuration for the side-paper figures: Albert Sans (OFL, google/fonts) from this
     directory first, then the system fonts. Used via FONTCONFIG_FILE by scripts/figstyle.py. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
